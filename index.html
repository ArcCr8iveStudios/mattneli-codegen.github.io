<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matthew // Aerospace Engineering Log</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f0eeea;
            background-image: repeating-linear-gradient(#ccc 0 1px, transparent 1px 28px),
                              repeating-linear-gradient(90deg, #ccc 0 1px, transparent 1px 28px);
            background-size: 28px 28px;
            font-family: 'Nunito', sans-serif;
            color: #111;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Top Header Component */
        header {
            background: #fff;
            border: 2.5px solid #111;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 5px 5px 0px #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        /* Neo-Brutalist Buttons */
        .btn-action {
            background: #FFD93D;
            border: 2.5px solid #111;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 3px 3px 0px #111;
            text-transform: uppercase;
            font-size: 12px;
        }
        .btn-action:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #111;
        }

        h2 {
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 32px 0 16px;
            display: inline-block;
            background: #4ECDC4;
            padding: 2px 10px;
            border: 2.5px solid #111;
            border-radius: 8px;
        }

        .project-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        /* Component Portfolio Cards */
        .card {
            background: #fff;
            border: 2.5px solid #111;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 5px 5px 0px #111;
            margin-bottom: 10px;
            text-align: left;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .pill {
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 20px;
            border: 2px solid #111;
        }
        .p-work { background: #111; color: #fff; }
        .p-content { background: #FF6B6B; color: #fff; }
        .p-date { font-size: 11px; font-weight: 800; color: #888; }

        .card-title {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 13px;
            font-weight: 700;
            color: #444;
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .media-box {
            background: #f7f7f2;
            border: 2px solid #111;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: #888;
            min-height: 60px;
        }
        iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border: none;
        }

        /* Fullscreen Workspace Overlay Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        .modal-card {
            background: white; border: 3px solid #111; border-radius: 14px;
            width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto;
            padding: 24px; box-shadow: 8px 8px 0px #111; position: relative;
        }
        .close-x {
            position: absolute; top: 15px; right: 15px; font-size: 20px;
            cursor: pointer; font-weight: 900;
        }

        /* Forms Layout configuration */
        .form-group { margin-bottom: 12px; text-align: left;}
        label { display: block; font-weight: 800; font-size: 11px; text-transform: uppercase; margin-bottom: 4px; }
        input, textarea, select {
            width: 100%; padding: 8px; border: 2px solid #111; border-radius: 6px;
            font-family: inherit; font-size: 13px; box-sizing: border-box;
        }
        
        /* Interactive Preview Panel Split view */
        .preview-pane {
            margin-top: 20px; border: 2.5px dashed #111; padding: 14px;
            border-radius: 10px; background: #fafafa;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <div class="logo-text">Matthew_Aero.log</div>
                <div style="font-size: 13px; font-weight: 800; color: #666; margin-top: 4px;">Autonomous Rocket & Hypersonic Avionics Development</div>
            </div>
            <button class="btn-action" onclick="openAdminModal()">Admin Panel</button>
        </header>

        <h2>📱 Engineering Project Feed</h2>
        <div id="liveFeed" class="project-grid">
            </div>
    </div>

    <div id="adminModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <span class="close-x" onclick="closeAdminModal()">❌</span>
            
            <div id="authPanel" style="text-align: center; padding: 20px 0;">
                <h3 style="font-weight: 900; margin-bottom: 14px; text-transform: uppercase;">Security Authorization</h3>
                <div class="form-group" style="max-width: 200px; margin: 0 auto 14px;">
                    <input type="password" id="pinField" placeholder="Enter System PIN" style="text-align: center; font-size: 18px; letter-spacing: 4px;">
                </div>
                <button class="btn-action" onclick="verifyAccessCode()">Unlock Matrix</button>
            </div>

            <div id="dashboardPanel" style="display: none;">
                <h3 style="font-weight: 900; text-transform: uppercase; border-bottom: 2.5px dashed #111; padding-bottom: 8px; margin-bottom: 16px;">Log Entry Terminal</h3>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label>Entry Title</label>
                        <input type="text" id="entryTitle" placeholder="e.g., Grid Fin CFD Sweep" oninput="updateLivePreview()">
                    </div>
                    <div class="form-group">
                        <label>Date / Mission Phase</label>
                        <input type="text" id="entryDate" placeholder="e.g., July 4, 2026" oninput="updateLivePreview()">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label>System Classification</label>
                        <select id="entryType" onchange="updateLivePreview()">
                            <option value="YouTube Short">YouTube Short</option>
                            <option value="Research & Test">Research & Test</option>
                            <option value="CAD Synthesis">CAD Synthesis</option>
                            <option value="Simulations">Simulations</option>
                            <option value="Avionics Math">Avionics Math</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Visual Interface Tag</label>
                        <select id="entryColor" onchange="updateLivePreview()">
                            <option value="p-content">Red (Content Highlight)</option>
                            <option value="p-work">Black (System Engineering)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Terminal Activity Logs (Description)</label>
                    <textarea id="entryDesc" rows="3" placeholder="Document specific system variables, math, or structural revisions crunched..." oninput="updateLivePreview()"></textarea>
                </div>

                <div class="form-group">
                    <label>Media Pipeline Configuration (YouTube Share Embed Iframe Tag Only)</label>
                    <textarea id="entryMedia" rows="2" placeholder='<iframe src="https://www.youtube.com/embed/XXXXXX" ...></iframe>' oninput="updateLivePreview()"></textarea>
                </div>

                <button class="btn-action" style="background: #4ECDC4; width: 100%; margin-top: 10px;" onclick="commitEntryLog()">Commit Log to local memory</button>

                <div class="preview-pane">
                    <h5 style="font-size: 10px; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; color: #666;">✨ Real-time Component Preview Box</h5>
                    <div id="previewContainer"></div>
                </div>

                <div style="margin-top: 24px; border-top: 2.5px dashed #111; padding-top: 16px; text-align: center;">
                    <button class="btn-action" style="background: #FF6B6B; color: white; width: 100%; font-size: 14px; padding: 12px;" onclick="compileGlobalDeploymentCode()">⚡ Compile & Copy Master Site Code</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // DATA STORAGE INITIALIZATION LAYER
        // The automation payload dynamically populates data arrays inside this container element below
        const compiledStaticDatabase = /* SYSTEM_DATA_INJECTION */ [] /* END_INJECTION */;

        // Sync and parse active browser caching or fall back directly to structural static arrays
        let flightLogEntries = JSON.parse(localStorage.getItem('aero_log_registry')) || compiledStaticDatabase;
        
        // Sync local storage state on initial startup
        if (localStorage.getItem('aero_log_registry') === null && compiledStaticDatabase.length > 0) {
            localStorage.setItem('aero_log_registry', JSON.stringify(compiledStaticDatabase));
        }

        // Global Application State Controller
        let userHasAuthorizedAccess = false;

        // Render system loop logic
        function renderCoreTelemetryFeed() {
            const feedContainer = document.getElementById('liveFeed');
            if(!feedContainer) return;
            
            if (flightLogEntries.length === 0) {
                feedContainer.innerHTML = `<div class="card" style="text-align:center; color:#888;">No system log entries registered in local registry variables. Open the terminal panel to commit entries.</div>`;
                return;
            }

            let generatedFeedHTML = '';
            flightLogEntries.forEach((item) => {
                generatedFeedHTML += generateCardHTMLMarkup(item);
            });
            feedContainer.innerHTML = generatedFeedHTML;
        }

        function generateCardHTMLMarkup(dataObj) {
            return `
            <div class="card">
                <div class="card-meta">
                    <span class="pill ${dataObj.colorClass}">${dataObj.type}</span>
                    <span class="p-date">${dataObj.date}</span>
                </div>
                <div class="card-title">${dataObj.title}</div>
                <div class="card-desc">${dataObj.desc}</div>
                <div class="media-box">${dataObj.media}</div>
            </div>`;
        }

        // UI View Port Controls
        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'flex';
            if (userHasAuthorizedAccess) {
                showDashboardPanel();
            } else {
                document.getElementById('authPanel').style.display = 'block';
                document.getElementById('dashboardPanel').style.display = 'none';
                document.getElementById('pinField').focus();
            }
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        // Authentication System Layer
        function verifyAccessCode() {
            const parsedPinValue = document.getElementById('pinField').value;
            if (parsedPinValue === "8532") {
                userHasAuthorizedAccess = true;
                showDashboardPanel();
            } else {
                alert("Authorization Denied: Invalid Access Credentials.");
                document.getElementById('pinField').value = '';
            }
        }

        function showDashboardPanel() {
            document.getElementById('authPanel').style.display = 'none';
            document.getElementById('dashboardPanel').style.display = 'block';
            updateLivePreview();
        }

        // Live Workspace Preview Controller
        function updateLivePreview() {
            const targetPreviewPane = document.getElementById('previewContainer');
            
            const mockDataInstance = {
                title: document.getElementById('entryTitle').value || "Interferometry Vector Array Title",
                date: document.getElementById('entryDate').value || "Phase Alpha Deployment Date",
                type: document.getElementById('entryType').value,
                colorClass: document.getElementById('entryColor').value,
                desc: document.getElementById('entryDesc').value || "Sample dynamic text reflecting performance characteristics relative to structural loading arrays...",
                media: document.getElementById('entryMedia').value || '<div style="padding:10px; font-size:11px;">[ Structural System Media Sandbox Area ]</div>'
            };

            targetPreviewPane.innerHTML = generateCardHTMLMarkup(mockDataInstance);
        }

        // State Modulation: Commit New Registry Logs
        function commitEntryLog() {
            const title = document.getElementById('entryTitle').value;
            const date = document.getElementById('entryDate').value;
            const type = document.getElementById('entryType').value;
            const colorClass = document.getElementById('entryColor').value;
            const desc = document.getElementById('entryDesc').value;
            let media = document.getElementById('entryMedia').value;

            if (!title || !date || !desc) {
                alert("Operation Aborted: Essential telemetry matrices (Title, Date, Logs) must be defined.");
                return;
            }
            if (!media) { media = '<div style="padding:14px; font-size:11px;">[ No External Target Media Linked ]</div>'; }

            // Add the new data object directly to the front of the database array
            flightLogEntries.unshift({ title, date, type, colorClass, desc, media });
            
            // Persist the array into the local browser storage cache
            localStorage.setItem('aero_log_registry', JSON.stringify(flightLogEntries));
            
            // Re-render user view dashboards instantly
            renderCoreTelemetryFeed();
            updateLivePreview();
            
            // Reset administrative form fields
            document.getElementById('entryTitle').value = '';
            document.getElementById('entryDate').value = '';
            document.getElementById('entryDesc').value = '';
            document.getElementById('entryMedia').value = '';
            
            alert("System Success: Structural log instance committed to local browser context memory arrays!");
        }

        // Master Deployment Source Code Exporter Engine
        function compileGlobalDeploymentCode() {
            // Read the full structure of the current active webpage document
            const outerHTMLString = document.documentElement.outerHTML;
            
            // Regex match expression sequences targeting standard JSON database containers
            const scanningRegexExpression = /\/\* SYSTEM_DATA_INJECTION \*\/([\s\S]*?)\/\* END_INJECTION \*\//;
            
            // Format existing entry lists cleanly into string structures
            const formattedPayloadString = `/* SYSTEM_DATA_INJECTION */ ${JSON.stringify(flightLogEntries, null, 2)} /* END_INJECTION */`;
            
            // Inject new values back into output structure
            let compiledDistributionSourceCode = outerHTMLString.replace(scanningRegexExpression, formattedPayloadString);
            
            // Clean interface modal visibility parameters within source generation strings
            compiledDistributionSourceCode = compiledDistributionSourceCode.replace('id="adminModal" class="modal-overlay" style="display: flex;"', 'id="adminModal" class="modal-overlay" style="display: none;"');
            
            // Copy output to system copy registers
            navigator.clipboard.writeText("<!DOCTYPE html>\n" + compiledDistributionSourceCode).then(() => {
                alert("🚀 Operational Codebase Compiled Successfully!\n\nThe updated deployment code has been copied to your clipboard. Paste this directly to overwrite your GitHub index.html file.");
            }).catch(err => {
                console.error("System pipeline error duplicating compiled arrays: ", err);
                alert("Failed copy. Code output string printed to engineering logs terminal console panel instead.");
                console.log("<!DOCTYPE html>\n" + compiledDistributionSourceCode);
            });
        }

        // Execute primary application loops on viewport validation loops
        renderCoreTelemetryFeed();
    </script>
</body>
</html>
